name: 构建独立程序与 Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build:
    name: 独立程序 / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            file: nexus-edge-windows-x64.exe
          - target: linux-x64
            os: ubuntu-22.04
            file: nexus-edge-linux-x64
          - target: linux-arm64
            os: ubuntu-22.04-arm
            file: nexus-edge-linux-arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: 检查标签与源码版本
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: bun scripts/build-release.ts --check-tag "$RELEASE_TAG"
      - run: bun run typecheck
      - name: 在目标架构运行回归
        run: bun test
      - name: 编译发布程序
        run: bun run build:release --target ${{ matrix.target }}
      - name: 验证无外部 Bun 的独立程序
        run: bun run test:release
      - name: 安装 Windows 终端测试依赖
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check pywinpty==3.1.2
      - name: 验证独立程序原生交互
        run: python -X utf8 tests/executable-pty.py dist/${{ matrix.target }}/${{ matrix.file }}
      - name: 上传可执行文件和校验值
        uses: actions/upload-artifact@v4.6.2
        with:
          name: executable-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 校验全部产物后发布
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [tests, build]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-nexus-edge
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: executable-*
          path: dist/artifacts
      - name: 汇总并验证 SHA-256
        run: bun scripts/assemble-release.ts
      # 自动按版本创建 tag；同提交草稿可重试，已公开版本不会覆盖。
      - name: 创建 Release 并上传完整产物
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const { publishRelease } = require('./scripts/publish-release.cjs');
            await publishRelease({ github, context, core });
